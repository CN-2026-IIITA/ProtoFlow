name: Build Tauri App

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-linux:
        if: contains(github.event.head_commit.message, '[do ci]') || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install Linux deps
              run: |
                  sudo apt update
                  sudo apt install -y \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    build-essential \
                    patchelf \
                    libssl-dev

            - name: Install deps
              run: |
                  npm install
                  npm install --prefix backend

            - name: Build app
              run: npm run ci:build

            - name: Upload Linux artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-build
                  path: src-tauri/target/release/bundle/

    build-windows:
        if: contains(github.event.head_commit.message, '[do ci]') || github.event_name == 'workflow_dispatch'
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Install deps
              run: |
                  npm install
                  npm install --prefix backend

            - name: Build app
              run: npm run ci:build

            - name: Upload Windows artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-build
                  path: src-tauri/target/release/bundle/
